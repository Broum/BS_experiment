[project]
name = "bs-experiment"
version = "0.1.0"
description = "Truncated beam-splitter circuits on the VLQ quantum computer (GBS4EO)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # VLQ access: qaas (module `qheappe_client`) + LEXIS auth; the extra pulls iqm-client 36.x.
    "qaas[iqm-qiskit]==1.0.*",
    "py4lexis==7.1.*",
    # py4lexis depends on this via a git URL, which uv only accepts when declared here.
    "python-http-irods-client @ git+https://opencode.it4i.eu/lexis-platform/data/python-http-irods-client.git@1.3.6",
    "qiskit>=2.0,<2.2",
    "qiskit-aer",
    "gbs-compiler>=0.2.5",
    "numpy",
    "scipy",
    "matplotlib",
    "pylatexenc",
    "ipykernel",
    "python-dotenv",
    "plotly>=7.1.0",
    "kaleido>=1.5.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
# py4lexis is not on public PyPI.
name = "it4i"
url = "https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple"
explicit = true

[tool.uv.sources]
py4lexis = { index = "it4i" }
gbs-compiler = { git = "https://github.com/Quantum-Cosmos-Lab/gbs-compiler" }
